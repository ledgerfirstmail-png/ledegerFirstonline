<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Thank you for contacting Ledger First. We'll be in touch within 24 hours.">
<title>Thank You — Ledger First</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #d4af37;
    --accent2: #00d4aa;
    --bg: #0a0a0f;
    --fg: #f0f0f5;
    --muted: #8899aa;
    --card: rgba(20,20,35,0.7);
    --cardborder: rgba(212,175,55,0.2);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Outfit',sans-serif;
    background:var(--bg);
    color:var(--fg);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px;
  }
  #three-canvas {
    position:fixed; top:0; left:0;
    width:100%; height:100%;
    z-index:0; pointer-events:none;
  }
  .content { position:relative; z-index:2; }
  .checkmark {
    width:80px; height:80px;
    background:linear-gradient(135deg, var(--accent2), var(--accent));
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 32px;
    font-size:2.5rem;
  }
  h1 {
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(2rem, 5vw, 3.5rem);
    font-weight:700; margin-bottom:16px;
    text-transform:uppercase; letter-spacing:-1px;
  }
  p {
    color:var(--muted); font-size:1.1rem;
    max-width:500px; margin:0 auto 32px;
    line-height:1.6;
  }
  .btn {
    padding:14px 32px; border-radius:999px;
    font-family:'Outfit',sans-serif; font-weight:600; font-size:0.9rem;
    text-decoration:none; letter-spacing:1px; text-transform:uppercase;
    transition:all 0.3s ease; cursor:pointer; border:none;
    display:inline-block;
  }
  .btn-primary {
    background:linear-gradient(135deg, var(--accent), #b8960c);
    color:#000;
    box-shadow:0 8px 30px rgba(212,175,55,0.3);
  }
  .btn-primary:hover {
    transform:translateY(-3px) scale(1.03);
    box-shadow:0 12px 40px rgba(212,175,55,0.5);
  }
  .timer {
    color:var(--accent); font-size:2rem; font-weight:700;
    margin:24px 0;
  }
</style>
</head>
<body>

<canvas id="three-canvas"></canvas>

<div class="content">
  <div class="checkmark">✓</div>
  <h1>Thank You!</h1>
  <p>Your message has been sent. We typically respond within <strong style="color:var(--accent);">24 hours</strong>.</p>
  <p>While you wait, explore our apps or check out pricing.</p>
  <div style="display:flex; gap:16px; justify-content:center; flex-wrap:wrap;">
    <a href="index.html" class="btn btn-primary">Back to Home</a>
    <a href="pricing.html" class="btn btn-primary" style="background:transparent; border:1px solid var(--accent); color:var(--accent);">View Pricing</a>
  </div>
  <div class="timer" id="timer">Redirecting in 10...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Three.js background
(function(){
  const canvas = document.getElementById('three-canvas');
  const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 30;
  const starGeo = new THREE.BufferGeometry();
  const starCount = 800;
  const pos = new Float32Array(starCount*3);
  for(let i=0;i<starCount;i++){
    pos[i*3]=(Math.random()-0.5)*200;
    pos[i*3+1]=(Math.random()-0.5)*200;
    pos[i*3+2]=(Math.random()-0.5)*100-20;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const starMat = new THREE.PointsMaterial({
    color:0xd4af37, size:0.12, transparent:true, opacity:0.5, blending:THREE.AdditiveBlending
  });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);
  function animate(){
    requestAnimationFrame(animate);
    stars.rotation.y += 0.0002;
    renderer.render(scene, camera);
  }
  animate();
})();

// Countdown timer
let seconds = 10;
const timerEl = document.getElementById('timer');
const interval = setInterval(() => {
  seconds--;
  if (seconds > 0) {
    timerEl.textContent = `Redirecting in ${seconds}...`;
  } else {
    clearInterval(interval);
    window.location.href = 'index.html';
  }
}, 1000);
</script>

</body>
</html>
